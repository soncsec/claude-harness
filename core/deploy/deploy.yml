# Installed by claude-harness (source: core/deploy/deploy.yml) when the
# operator runs scripts/setup-deploy.sh. See docs/deploy.md in the harness.
#
# Ships main: builds a container image, re-checks dependencies, deploys to
# staging, then to production once the operator approves the "production"
# environment in GitHub. Agents cannot approve deployments.
name: deploy

on:
  push:
    branches: [main]

# No permissions by default; each job asks only for what it needs.
permissions: {}

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false
      - name: pip-audit uv.lock (advisories published since the pull request was checked)
        run: |
          if [ -f uv.lock ]; then
            uv export --frozen --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/req.txt"
            uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/req.txt" \
              --disable-pip --require-hashes --strict
          fi
      - name: prepare the build context (make container-context)
        run: |
          if make -n container-context >/dev/null 2>&1; then
            make container-context
          fi
      - name: emulate the other CPU architectures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-user-static
      - name: build and push the image (one digest for every platform)
        id: push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # Intel/AMD and ARM servers alike; set DEPLOY_PLATFORMS to build fewer.
          PLATFORMS: ${{ vars.DEPLOY_PLATFORMS || 'linux/amd64,linux/arm64' }}
        run: |
          [[ $PLATFORMS =~ ^linux/[a-z0-9]+(,linux/[a-z0-9]+)*$ ]] || { echo "bad DEPLOY_PLATFORMS: $PLATFORMS"; exit 1; }
          image="ghcr.io/${REPO,,}"
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          podman build --pull=always -f Containerfile --platform "$PLATFORMS" --manifest "$image:$SHA" \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.revision=$SHA" .
          podman manifest push --all --digestfile "$RUNNER_TEMP/digest" "$image:$SHA" "docker://$image:$SHA"
          podman logout ghcr.io
          echo "image=$image@$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"

  staging:
    name: staging
    needs: build
    # GitHub's runners, or a runner inside your network when the servers are
    # not reachable from the internet (setup-deploy.sh --runner).
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: staging
    permissions: {}
    steps:
      - name: deploy to staging (the server checks the image and rolls back if unhealthy)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$DEPLOY_HOST" "$IMAGE"

  production:
    name: production
    needs: [build, staging]
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    # Waits for the operator's approval. prevent_self_review stays off on
    # purpose: the operator's own merge starts each deploy and they are the only
    # reviewer, so turning it on would block every production deploy. Agents
    # cannot approve either way: they are not reviewers.
    environment: production
    permissions: {}
    steps:
      - name: deploy to production (the server checks the image and rolls back if unhealthy)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$DEPLOY_HOST" "$IMAGE"
