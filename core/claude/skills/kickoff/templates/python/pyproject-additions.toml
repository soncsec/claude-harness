# Add these sections to the pyproject.toml that `uv init` created. Add packages
# with `uv add` (and `uv add --dev pytest ruff` for the dev tools), never by
# editing the dependency lists here: `uv add` asks the operator first.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, S: security (bandit rules), UP: modern syntax
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert on purpose.
"tests/**" = ["S101"]

[tool.uv]
# Supply-chain cooldown: ignore releases younger than 7 days. Malicious package
# versions are usually caught and pulled within days of publishing.
exclude-newer = "7 days"
