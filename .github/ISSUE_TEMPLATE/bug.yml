name: Bug
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Found a security vulnerability? Do not open an issue: use
        **Security → Report a vulnerability**, so the report stays private.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `make run`
        2. POST /notes with an empty body
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      placeholder: |
        Expected: 422 with a validation message.
        Actual: 500 Internal Server Error.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >-
        What must be true once it is fixed. The first one is usually a test that
        fails today.
    validations:
      required: true
  - type: checkboxes
    id: security-impact
    attributes:
      label: Security impact
      description: Tick everything this touches. If you tick any, add the `security` label.
      options:
        - label: Sign-in, sessions or permissions
        - label: Personal or sensitive data
        - label: Input from users, files or other systems
        - label: Secrets, keys or credentials
        - label: A new dependency or external service
