[project]
name = "notes-api"
version = "0.1.0"
description = "The claude-harness example app: a small notes API with per-user access."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140",
    "uvicorn>=0.50",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, S: security (bandit rules), UP: modern syntax
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixed test passwords on purpose.
"tests/**" = ["S101", "S105", "S106"]

[tool.uv]
# Supply-chain cooldown: ignore releases younger than 7 days. Malicious package
# versions are usually caught and pulled within days of publishing.
exclude-newer = "7 days"
